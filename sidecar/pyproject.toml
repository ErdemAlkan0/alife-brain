[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alifebrain-sidecar"
version = "0.1.0"
description = "Sidecar process for the A-Life Brain Project Zomboid mod"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
alifebrain-sidecar = "alifebrain_sidecar.__main__:main"

[tool.setuptools.packages.find]
include = ["alifebrain_sidecar*"]
